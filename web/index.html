<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#10120d">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Airsoft Conflict">
<title>Airsoft Conflict</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="img/icon-192.png">
<link rel="apple-touch-icon" href="img/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=JetBrains+Mono:wght@500;700&family=Saira+Stencil+One&display=swap" rel="stylesheet">
<link rel="stylesheet" href="app.css">
</head>
<body>
<header class="top" id="top">
  <span class="top-logo" aria-hidden="true"></span>
  <h1>AIRSOFT <span>CONFLICT</span></h1>
  <button type="button" class="icon-btn" id="btnMenu" aria-label="Menu" hidden>
    <svg viewBox="0 0 24 24" width="24" height="24" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/></svg>
  </button>
</header>

<main id="app"></main>
<p class="versione" id="versione"></p>

<!-- accesso -->
<div class="gate" id="gate">
  <div class="gate-box">
    <span class="gate-logo" aria-hidden="true"></span>
    <h2>AIRSOFT <span>CONFLICT</span></h2>
    <div id="gate-carico"><p class="hint">Caricamento…</p></div>
    <div id="gate-login" hidden>
      <p>Accedi con Google per vedere i conflict a cui sei invitato.</p>
      <button type="button" class="btn accent big" id="btnLogin">Accedi con Google</button>
    </div>
    <div id="gate-errore" hidden>
      <p id="gateErrore"></p>
      <button type="button" class="btn" id="btnRiprova">Riprova</button>
    </div>
  </div>
</div>

<!-- schermo intero: giorno del conflict e partita -->
<section class="pieno" id="pieno" hidden></section>

<!-- menu e finestre dal basso -->
<div class="velo" id="velo" hidden></div>
<div class="foglio" id="foglio" hidden></div>

<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore-compat.js"></script>
<script src="config.js"></script>
<script src="db.js"></script>
<script src="qr.js"></script>
<script src="vendor/jsQR.js"></script>
<script src="utm.js"></script>
<script src="mappe.js"></script>
<script src="fazioni.js"></script>
<script src="pcs.js"></script>
<script src="app.js"></script>
</body>
</html>
