; Airsoft Conflict — bandiere elettroniche su LILYGO T-Beam (ESP32 + LoRa SX1278 433 MHz + GPS)
; Due programmi dallo stesso codice:
;   bandiera : conta i tag Bluetooth dei giocatori e manda il conteggio via LoRa
;   hq       : riceve le bandiere via LoRa e le mostra (sul computer e sul display)
; In VS Code con PlatformIO: scegli l'ambiente in basso (env:bandiera o env:hq) e premi Upload.

[env]
platform = espressif32@6.9.0
board = ttgo-t-beam
framework = arduino
monitor_speed = 115200
board_build.partitions = huge_app.csv
lib_deps =
  jgromes/RadioLib@~6.6.0
  h2zero/NimBLE-Arduino@~1.4.2
  lewisxhe/XPowersLib@^0.2.1
  mikalhart/TinyGPSPlus@^1.0.3
  adafruit/Adafruit SSD1306@^2.5.7
  adafruit/Adafruit GFX Library@^1.11.5

[env:bandiera]
build_flags = -D RUOLO_BANDIERA

[env:hq]
build_flags = -D RUOLO_HQ
