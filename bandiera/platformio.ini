; Airsoft Conflict — bandiere elettroniche su LILYGO T-Beam (ESP32 + LoRa SX1278 433 MHz + GPS)
; Tre programmi dallo stesso codice:
;   bandiera : conta i tag Bluetooth dei giocatori, fa la conquista (luce + cicalino) e manda tutto via LoRa
;   hq       : riceve le bandiere via LoRa e le passa all'app (USB o Bluetooth)
;   tag      : un T-Beam che fa finta di essere il tag di un giocatore (per le prove senza tag)
; Il modo più semplice: https://softair-giocate.web.app/firmware/ (si carica dal browser Chrome, col cavo USB).
; In alternativa VS Code con PlatformIO: scegli l'ambiente in basso (env:bandiera, env:hq o env:tag) e premi Upload.

[env]
platform = espressif32@6.9.0
board = ttgo-t-beam
framework = arduino
monitor_speed = 115200
board_build.partitions = huge_app.csv
lib_deps =
  jgromes/RadioLib@~6.6.0
  h2zero/NimBLE-Arduino@~1.4.2
  lewisxhe/XPowersLib@^0.2.1
  mikalhart/TinyGPSPlus@^1.0.3
  adafruit/Adafruit SSD1306@^2.5.7
  adafruit/Adafruit GFX Library@^1.11.5
  adafruit/Adafruit NeoPixel@^1.12.3

[env:bandiera]
build_flags = -D RUOLO_BANDIERA

[env:hq]
build_flags = -D RUOLO_HQ

[env:tag]
build_flags = -D RUOLO_TAG
