plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}
android {
    namespace 'it.airsoftconflict.officina'
    compileSdk 34
    defaultConfig {
        applicationId 'it.airsoftconflict.officina'
        minSdk 23
        targetSdk 34
        versionCode Integer.parseInt(System.getenv('VERSIONE_CODICE') ?: '1')
        versionName(System.getenv('VERSIONE_NOME') ?: '0.1')
    }
    signingConfigs {
        firma {
            storeFile file(System.getenv('KS_FILE') ?: 'firma.jks')
            storePassword System.getenv('KS_PASS') ?: 'officina'
            keyAlias System.getenv('KS_ALIAS') ?: 'officina'
            keyPassword System.getenv('KS_PASS') ?: 'officina'
        }
    }
    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.firma
        }
    }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
    kotlinOptions { jvmTarget = '17' }
    androidResources { noCompress += ['bin', 'js', 'json', 'html', 'css'] }
}
dependencies {
    implementation 'androidx.webkit:webkit:1.11.0'
    implementation 'androidx.core:core-ktx:1.13.1'
    implementation 'com.github.mik3y:usb-serial-for-android:3.8.1'
}
